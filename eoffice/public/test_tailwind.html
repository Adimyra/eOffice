<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Test</title>
  <link rel="stylesheet" href="/assets/eoffice/css/tailwind.min.css">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-blue-600 mb-4">Tailwind CSS Test</h1>
    <p class="text-gray-700 mb-4">This is a test page to verify that Tailwind CSS is working correctly.</p>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Card 1</h2>
        <p class="text-gray-600">This is a card with Tailwind CSS styling.</p>
        <button class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded">
          Button
        </button>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Card 2</h2>
        <p class="text-gray-600">This is another card with Tailwind CSS styling.</p>
        <button class="mt-4 bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded">
          Button
        </button>
      </div>
      <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Card 3</h2>
        <p class="text-gray-600">This is yet another card with Tailwind CSS styling.</p>
        <button class="mt-4 bg-purple-500 hover:bg-purple-600 text-white font-medium py-2 px-4 rounded">
          Button
        </button>
      </div>
    </div>
  </div>
</body>
</html>
